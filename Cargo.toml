[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/akshually"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkoestinger/akshually"
# Shipped as an app (release binaries), not via crates.io,
# where the `akshually` name belongs to another crate.
publish = false

[workspace.dependencies]
akshually-core = { path = "crates/akshually-core" }
akshually-ui = { path = "crates/akshually-ui" }
akshually-testkit = { path = "crates/akshually-testkit" }

# Rune is pre-release: pin one `dev` revision and upgrade it deliberately (ADR 0001).
# Only akshually-ui may depend on it.
rune = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f", features = ["markdown"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
mockito = "1.7"
# Desktop notifications on Linux, where rune-notify does nothing.
notify-rust = "4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitLab line codes name a file by the SHA-1 of its path.
sha1 = "0.11"
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# Blocking HTTP for the Forge adapters: no async runtime in the core.
ureq = { version = "3.5", features = ["json"] }
url = "2.5"

# CODING_STANDARDS.md, "Enforced by tooling". CI denies every warning.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Cargo ignores a dependency's [patch], so Rune's are repeated here, all at the pinned rev.
# Re-check `[patch.crates-io]` in Rune's root Cargo.toml whenever the rev is bumped.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }
winit = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "71fcd21d677c96bfbba52cb92b4ceb9de55a0b2f" }

# Rune builds are heavy: full debug info made a Rune test build use 18-23 GB of RAM.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
